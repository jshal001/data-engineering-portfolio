name: CI


on:
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
        
      - name: Install dependencies
        run: pip install pytest pytest-mock pyspark

      - name: Run pytests
        run: |
          cd spotify-tracks-pipeline
          python3 -m pytest test_bronze.py -v
      
      - name: Install dbt-databricks
        run: pip install dbt-databricks

      - name: Run dbt test
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          cd spotify-tracks-pipeline/spotify_dbt
          dbt run && dbt test